    function renderCategories(){ $('categoryList').innerHTML=Object.entries(meta).map(([p,m])=>`<div class="category-row"><div class="category-name" style="--category-color:${m[0]}"><span class="category-icon-preview">${m[2]}</span><div>${esc(p)}<small>${items.filter(x=>x.pillar===p).length} conteúdos no acervo</small></div></div><div class="category-color"><i style="background:${m[0]}"></i>${m[0]}</div><select class="category-icon-select" data-category="${esc(p)}" aria-label="Escolher ícone de ${esc(p)}">${categoryIconOptions.map(icon=>`<option value="${icon}" ${icon===m[2]?'selected':''}>${icon} ${icon===m[2]?'Atual':'Ícone'}</option>`).join('')}</select></div>`).join('');updateCategoryCount()}function openCategories(){$('categoryModal').hidden=false;document.body.style.overflow='hidden';renderCategories()}function closeCategories(){$('categoryModal').hidden=true;document.body.style.overflow=''}function saveCategoryIcon(p,icon){if(!meta[p])return;meta[p][2]=icon;localStorage.setItem('makro-category-icons',JSON.stringify(Object.fromEntries(Object.keys(meta).map(key=>[key,meta[key][2]]))));saveCategoryDefinitions();renderCategories();renderPillars();render();notify('Ícone atualizado',`${p} agora usa ${icon} no painel.`)}function toggleCompleted(){showCompleted=!showCompleted;localStorage.setItem('makro-show-completed',String(showCompleted));render();if(mode==='calendar')renderCalendar();notify(showCompleted?'Concluídas visíveis':'Concluídas ocultas',showCompleted?'O histórico aprovado voltou para o Kanban.':'O Kanban mostra apenas demandas em andamento.')}function selectFromCalendar(id){openSingleView(id)}
    $('query').addEventListener('input',render);$('pillarFilter').addEventListener('change',()=>{renderPillars();render()});$('formatFilter').addEventListener('change',render);$('statusFilter').addEventListener('change',event=>{if(event.target.value==='Aprovado'&&!showCompleted)toggleCompleted();else render()});$('clearSearch').onclick=()=>{$('query').value='';render()};$('clearFilters').onclick=resetFilters;$('completedToggle').onclick=toggleCompleted;$('sortButton').onclick=()=>{sortNewest=!sortNewest;updateSortLabel();render()};$('viewKanban').onclick=()=>setMode('kanban');$('viewCalendar').onclick=()=>setMode('calendar');$('navKanban').onclick=()=>{setMode('kanban');closeSideMenu()};$('navCalendar').onclick=()=>{setMode('calendar');closeSideMenu()};$('mobileKanban').onclick=()=>{setMode('kanban');closeSideMenu()};$('mobileCalendar').onclick=()=>{setMode('calendar');closeSideMenu()};$('mobileNewContent').onclick=openNewContent;$('openMenu').onclick=()=>{$('sidebar').classList.add('open');$('overlay').hidden=false};$('closeMenu').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').hidden=true};$('overlay').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').hidden=true};$('categoryTrigger').onclick=openCategories;$('closeCategoryModal').onclick=closeCategories;$('cancelCategoryModal').onclick=closeCategories;$('categoryBackdrop').onclick=closeCategories;$('newCategoryButton').onclick=openNewCategory;$('cancelNewCategory').onclick=closeNewCategory;$('saveNewCategory').onclick=saveNewCategory;$('categoryList').addEventListener('change',event=>{if(event.target.matches('.category-icon-select'))saveCategoryIcon(event.target.dataset.category,event.target.value)});$('pillarNav').addEventListener('click',event=>{const button=event.target.closest('[data-pillar]');if(button)setPillar(button.dataset.pillar)});$('sideHelp').onclick=openHelp;$('topHelp').onclick=openHelp;document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('categoryModal').hidden)closeCategories();else closeSideMenu()}});
    renderPillarOptions();renderPillars();renderCategories();updateCategoryCount();updateSortLabel();$('overlay').hidden=true;setMode('calendar');render();
  </script>
